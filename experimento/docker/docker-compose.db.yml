# Se ejecuta en la EC2 solventa-db:  docker compose -f docker-compose.db.yml up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: solventa
      POSTGRES_DB: solventa
    command: ['postgres', '-c', 'max_connections=200', '-c', 'shared_buffers=512MB']
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
