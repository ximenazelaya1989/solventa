# Levanta TODOS los microservicios en local (desarrollo y pruebas de humo).
# Cada servicio tiene su propia base de datos logica en un unico Postgres local;
# en AWS cada experimento despliega lo que necesite con su propia BD (RDS/Aurora).
#
#   docker compose up -d --build
#   curl http://localhost:18080/health
#   docker compose down -v      # borra tambien los datos

x-servicio-nest-bd: &nest-bd
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

x-bd-comun: &bd-comun
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_SYNCHRONIZE: "true"
  DB_POOL_MAX: "10"

services:
  postgres:
    image: postgres:16
    container_name: solventa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - solventa-pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: solventa-redis
    ports:
      - "16379:6379"

  api-gateway:
    build: ./services/api-gateway
    container_name: solventa-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      COTIZACION_URL: http://cotizacion:8000
      # EXP-008: cuota por socio con token bucket en Redis (apagada por defecto)
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST_S: ${RATE_LIMIT_BURST_S:-2}
      REDIS_URL: redis://redis:6379/1
    ports:
      - "18080:3000"
    depends_on:
      - cotizacion
    restart: unless-stopped

  cotizacion:
    build: ./services/cotizacion
    container_name: solventa-cotizacion
    environment:
      SERVICE_NAME: cotizacion
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/cotizacion_db
      PERFILAMIENTO_URL: http://perfilamiento:8000
      PERFILAMIENTO_TIMEOUT_S: ${PERFILAMIENTO_TIMEOUT_S:-2.0}
    ports:
      - "18001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      perfilamiento:
        condition: service_started
    restart: unless-stopped

  perfilamiento:
    build: ./services/perfilamiento
    container_name: solventa-perfilamiento
    environment:
      SERVICE_NAME: perfilamiento
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/perfilamiento_db
      REDIS_URL: redis://redis:6379/0
      # EXP-007: validacion de consentimiento (apagada por defecto)
      CONSENT_CHECK_ENABLED: ${CONSENT_CHECK_ENABLED:-false}
      CONSENTIMIENTO_URL: http://consentimiento:8000
      CONSENT_CACHE_TTL_S: ${CONSENT_CACHE_TTL_S:-60}
      JWT_SECRET: ${JWT_SECRET:-solventa-local}
      # EXP-009: llamada a Open Finance (apagada por defecto)
      OPEN_FINANCE_ENABLED: ${OPEN_FINANCE_ENABLED:-false}
      OPEN_FINANCE_URL: http://mock-open-finance:8000
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-false}
      OPEN_FINANCE_ADMIN_ENABLED: ${OPEN_FINANCE_ADMIN_ENABLED:-true}
    ports:
      - "18002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  mock-open-finance:
    build: ./services/mock-open-finance
    container_name: solventa-mock-open-finance
    environment:
      SERVICE_NAME: mock-open-finance
    ports:
      - "18009:8000"
    restart: unless-stopped

  pagos:
    <<: *nest-bd
    build: ./services/pagos
    container_name: solventa-pagos
    environment:
      <<: *bd-comun
      SERVICE_NAME: pagos
      DB_NAME: pagos_db
    ports:
      - "18003:3000"

  siniestros:
    <<: *nest-bd
    build: ./services/siniestros
    container_name: solventa-siniestros
    environment:
      <<: *bd-comun
      SERVICE_NAME: siniestros
      DB_NAME: siniestros_db
    ports:
      - "18004:3000"

  consentimiento:
    build: ./services/consentimiento
    container_name: solventa-consentimiento
    environment:
      SERVICE_NAME: consentimiento
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/consentimiento_db
      JWT_SECRET: ${JWT_SECRET:-solventa-local}
    ports:
      - "18005:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  distribucion-socios:
    <<: *nest-bd
    build: ./services/distribucion-socios
    container_name: solventa-distribucion-socios
    environment:
      <<: *bd-comun
      SERVICE_NAME: distribucion-socios
      DB_NAME: socios_db
    ports:
      - "18006:3000"

  suscripcion-polizas:
    <<: *nest-bd
    build: ./services/suscripcion-polizas
    container_name: solventa-suscripcion-polizas
    environment:
      <<: *bd-comun
      SERVICE_NAME: suscripcion-polizas
      DB_NAME: suscripcion_db
    ports:
      - "18007:3000"

  fraude-reportes:
    <<: *nest-bd
    build: ./services/fraude-reportes
    container_name: solventa-fraude-reportes
    environment:
      <<: *bd-comun
      SERVICE_NAME: fraude-reportes
      DB_NAME: fraude_db
    ports:
      - "18008:3000"

volumes:
  solventa-pg-data:
