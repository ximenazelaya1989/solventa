events {}

http {
  upstream solventa {
    least_conn;
    server api-1:3000;
    server api-2:3000;
    server api-3:3000;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://solventa;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
